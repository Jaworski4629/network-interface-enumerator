[project]
name = "network-interface-enumerator"
version = "0.1.0"
description = "Wrap ioctl or getifaddrs to list interface names, addresses, netmasks, and flags in a portable structure."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
